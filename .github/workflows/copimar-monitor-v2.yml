name: COPIMAR Monitor Mensual

on:
  schedule:
    - cron: '0 8 15 * *'
  workflow_dispatch:

jobs:
  monitor:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GH_TOKEN }}
    steps:
      - name: Verificar y reparar
        id: check
        run: |
          pip install requests -q
          python3 - <<'PYEOF'
          import requests, sys, os, json
          from datetime import datetime, timedelta, timezone

          URL = "https://snxqmtaieewnnhrtbgtl.supabase.co"
          KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InNueHFtdGFpZWV3bm5ocnRiZ3RsIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzA0Njc2NzMsImV4cCI6MjA4NjA0MzY3M30.OD5AFXTmvny23v6_CJqc6s2_xewYC672I_ARmQeGy6M"
          GH_TOKEN  = os.environ.get("GH_TOKEN", "")
          GH_OWNER  = "lupecata-bot"
          GH_REPO   = "copimar-supabase-monitor"

          H = {"apikey": KEY, "Authorization": f"Bearer {KEY}"}

          problemas = []
          reparaciones = []

          # 1. Comprobar conectividad Supabase
          print("=== 1. Conectividad Supabase ===")
          try:
              r = requests.get(f"{URL}/rest/v1/equipos?select=id&limit=1",
                               headers=H, timeout=10)
              if r.status_code == 200:
                  print("  OK - Supabase responde")
              else:
                  raise Exception(f"HTTP {r.status_code}: {r.text[:200]}")
          except Exception as e:
              msg = f"Supabase no responde: {e}"
              print(f"  ERROR - {msg}")
              problemas.append(msg)

          # 2. Comprobar datos recientes en lecturas
          print("\n=== 2. Datos recientes en lecturas ===")
          try:
              r = requests.get(
                  f"{URL}/rest/v1/lecturas?select=fecha_lectura&order=fecha_lectura.desc&limit=1",
                  headers=H, timeout=10)
              rows = r.json()
              if rows:
                  ultima = rows[0]["fecha_lectura"]
                  fecha_ultima = datetime.strptime(ultima, "%Y-%m-%d").date()
                  dias = (datetime.now().date() - fecha_ultima).days
                  print(f"  Ultima lectura: {ultima} (hace {dias} dias)")
                  if dias > 10:
                      msg = f"Sin lecturas en {dias} dias (ultima: {ultima})"
                      problemas.append(msg)
                      print(f"  AVISO - {msg}")
              else:
                  msg = "Tabla lecturas vacia"
                  problemas.append(msg)
                  print(f"  AVISO - {msg}")
          except Exception as e:
              msg = f"Error leyendo lecturas: {e}"
              problemas.append(msg)
              print(f"  ERROR - {msg}")

          # 3. Comprobar que hay registros para los 4 clientes clave
          print("\n=== 3. Clientes clave (2222/3333/4444/5555) ===")
          for codigo in ["2222", "3333", "4444", "5555"]:
              try:
                  r = requests.get(
                      f"{URL}/rest/v1/lecturas?select=codigo_cliente&codigo_cliente=eq.{codigo}&limit=1",
                      headers=H, timeout=10)
                  found = len(r.json())
                  status = "OK" if found > 0 else "SIN DATOS"
                  print(f"  Cliente {codigo}: {status}")
                  if found == 0:
                      problemas.append(f"Sin datos para cliente {codigo}")
              except Exception as e:
                  print(f"  ERROR cliente {codigo}: {e}")

          # 4. Si hay problemas, lanzar keepalive de emergencia
          print("\n=== 4. Reparacion automatica ===")
          if problemas and GH_TOKEN:
              try:
                  gh_headers = {
                      "Authorization": f"Bearer {GH_TOKEN}",
                      "Accept": "application/vnd.github+json"
                  }
                  resp = requests.post(
                      f"https://api.github.com/repos/{GH_OWNER}/{GH_REPO}/actions/workflows/copimar-keepalive.yml/dispatches",
                      headers=gh_headers,
                      json={"ref": "main"},
                      timeout=15
                  )
                  if resp.status_code in (204, 200):
                      rep = "Keepalive de emergencia lanzado correctamente"
                      reparaciones.append(rep)
                      print(f"  OK - {rep}")
                  else:
                      print(f"  ERROR al lanzar keepalive: HTTP {resp.status_code}")
              except Exception as e:
                  print(f"  ERROR al lanzar keepalive: {e}")
          elif not problemas:
              print("  No se necesita reparacion - todo OK")
          else:
              print("  AVISO: GH_TOKEN no configurado")

          # 5. Escribir resultado
          estado = "LISTO PARA EXPORTAR" if not problemas else "REQUIERE ATENCION"
          print(f"\n=== Resumen: {estado} ===")

          lineas = [f"ESTADO: {estado}", ""]
          if not problemas:
              lineas.append("Todo correcto. El exportador puede usarse sin incidencias.")
          else:
              lineas.append(f"Problemas detectados ({len(problemas)}):")
              for p in problemas:
                  lineas.append(f"  - {p}")
              lineas.append("")
              if reparaciones:
                  lineas.append("Reparaciones aplicadas:")
                  for rep in reparaciones:
                      lineas.append(f"  + {rep}")
              else:
                  lineas.append("No se pudieron aplicar reparaciones automaticas.")
          lineas.append(f"\nFecha revision: {datetime.now().strftime('%Y-%m-%d %H:%M')} UTC")

          with open("/tmp/monitor_result.txt", "w") as f:
              f.write("\n".join(lineas))

          if problemas and not reparaciones:
              sys.exit(1)
          PYEOF

      - name: Enviar informe por email
        if: always()
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.GMAIL_USER }}
          password: ${{ secrets.GMAIL_APP_PASSWORD }}
          subject: "COPIMAR Monitor - ${{ job.status == 'success' && 'TODO OK' || 'INCIDENCIA DETECTADA' }}"
          to: lupecata@gmail.com
          from: lupecata@gmail.com
          body_path: /tmp/monitor_result.txt
